# Async twin of net_smoketest_2node.yaml -- same 2-node smoke-test dataset,
# mode=async instead of sync. Not a real leaderboard run.
global_classes:
  - eimeria_intricata
  - calicophoron
  - moniezia_benedeni
  - fasciola
  - dicrocoelium
  - metastrongili
  - trichuris_trichiuria

model:
  arch: yolov8n.yaml
  imgsz: 480

federation:
  mode: async
  async_node_cycles: 2
  local_epochs: 1
  balanced_fraction: 0.02
  batch_size: 4
  lr0: 0.0008
  warmup_steps: 5
  grad_clip: 10.0
  workers: 0
  device: auto
  eval_interval: 2
  max_concurrent_nodes: 1
  staleness_alpha: 0.5

nodes:
  - name: node_A
    data_yaml: data/kfm_250423_clean12/node_A/data.yaml
    owned_classes: [eimeria_intricata, calicophoron, moniezia_benedeni]
  - name: node_B
    data_yaml: data/kfm_250423_clean12/node_B/data.yaml
    owned_classes: [fasciola, dicrocoelium, metastrongili, trichuris_trichiuria]

output_dir: runs/net_smoketest
seed: 0
