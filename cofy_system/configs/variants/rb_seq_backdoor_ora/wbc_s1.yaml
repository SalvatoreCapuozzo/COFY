global_classes:
- basophil
- eosinophil
- erythroblast
- immunoglobulin
- lymphocyte
- monocyte
- neutrophil
model:
  arch: configs/arch/yolo26_classic_l.yaml
  imgsz: 640
  pretrained: true
federation:
  local_epochs: 2
  batch_size: 4
  lr0: 0.0008
  warmup_steps: 20
  grad_clip: 10.0
  workers: 0
  device: auto
  balanced_fraction: 0.1
  rounds: 10
  async_node_cycles: 10
  staleness_alpha: 0.5
  max_concurrent_nodes: 1
  pseudo_label:
    enabled: false
    start_round: 5
    conf_thresh: 0.6
    weight: 0.5
  merge_rule: mean
  normalize_steps: false
  eval_interval: 1000
  keep_checkpoints: 1
  lr_schedule: linear
  lrf: 0.01
  async_order: shuffle
  swa_last: 4
  robust:
    attacker: node_B
    attack: none
    attack_factor: 1.0
    defense: ora
    enforce_ownership: true
nodes:
- name: node_A
  data_yaml: data/study/wbc/node_A/data.yaml
  owned_classes:
  - neutrophil
- name: node_B
  data_yaml: data/attack/wbc/node_B_backdoor/data.yaml
  owned_classes:
  - eosinophil
- name: node_C
  data_yaml: data/study/wbc/node_C/data.yaml
  owned_classes:
  - erythroblast
  - immunoglobulin
- name: node_D
  data_yaml: data/study/wbc/node_D/data.yaml
  owned_classes:
  - basophil
  - lymphocyte
  - monocyte
eval_data_yaml: data/study/wbc/_eval/data.yaml
output_dir: runs/variants/rb_seq_backdoor_ora/wbc
seed: 1
