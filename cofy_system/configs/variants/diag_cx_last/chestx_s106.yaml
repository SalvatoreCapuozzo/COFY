# DIAGNOSTIC (2026-11-02): confirm_v2async ChestX run of this seed, evaluated on its LAST global version
# (runs/variants/diag_cx_last/chestx/s<seed>/async/global_final.pt links to it) instead of the per-node average.
global_classes:
- Atelectasis
- Calcification
- Consolidation
- Effusion
- Emphysema
- Fibrosis
- Fracture
- Mass
- Nodule
- Pneumothorax
model:
  arch: configs/arch/yolo26_classic_l.yaml
  imgsz: 640
  pretrained: true
federation:
  local_epochs: 2
  batch_size: 4
  lr0: 0.0008
  warmup_steps: 20
  grad_clip: 10.0
  workers: 0
  device: auto
  balanced_fraction: 0.5
  rounds: 28
  async_node_cycles: 28
  staleness_alpha: 0.5
  max_concurrent_nodes: 1
  pseudo_label:
    enabled: false
    start_round: 5
    conf_thresh: 0.6
    weight: 0.5
  merge_rule: mean
  normalize_steps: false
  eval_interval: 1000
  keep_checkpoints: 1
  lr_schedule: linear
  lrf: 0.01
  async_order: fixed
  swa_last: 0
  swa_per_node: true
  async_clock: virtual
  async_stop: cycles
  virtual_jitter: 0.2
  virtual_hw_spread: 0.3
  progressive_refresh: true
nodes:
- name: node_A
  data_yaml: data/study/chestx/node_A/data.yaml
  owned_classes:
  - Consolidation
- name: node_B
  data_yaml: data/study/chestx/node_B/data.yaml
  owned_classes:
  - Effusion
- name: node_C
  data_yaml: data/study/chestx/node_C/data.yaml
  owned_classes:
  - Atelectasis
  - Calcification
  - Nodule
  - Pneumothorax
- name: node_D
  data_yaml: data/study/chestx/node_D/data.yaml
  owned_classes:
  - Emphysema
  - Fibrosis
  - Fracture
  - Mass
eval_data_yaml: data/study/chestx/_eval/data.yaml
output_dir: runs/variants/diag_cx_last/chestx
seed: 106
