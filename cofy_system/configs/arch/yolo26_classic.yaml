# YOLO26 backbone/neck, classic (non end2end) detect head. Identical
# topology to ultralytics' stock yolo26.yaml except for the one overridden
# top-level key below -- this is fedyolo's "Phase 1" bridge: same modern
# backbone (C3k2 + C2PSA), but a Detect head shape-compatible with the
# existing per-class FedAvg split (cv3.{i}.2) and v8DetectionLoss, so no
# changes to model.py / server.py / pseudo_label.py are needed.
#
# reg_max is deliberately kept at 1 (stock yolo26's own value), not forced
# to 16 as an earlier version of this file did -- explicitly set here, not
# just omitted, since parse_model() falls back to Detect's own
# constructor default (16) if the key is absent entirely, not to whatever
# "the stock arch would have used." v8DetectionLoss/BboxLoss already
# handle reg_max=1 correctly (DFL becomes nn.Identity(), same as it would
# for the end2end version) -- reg_max=16 was never required for
# compatibility, and forcing it created a real, measured cost: it made the
# box-regression branch (cv2) shape-mismatch against the real yolo26
# checkpoint's own reg_max=1 cv2 branch, so `_pretrained_ckpt_name()`'s
# shared-weight transfer silently skipped it every run. Keeping reg_max=1
# lets that branch transfer from the real checkpoint too, not just
# backbone/neck.
nc: 80
end2end: False   # was True in stock yolo26.yaml -- classic dual top-k assignment
reg_max: 1       # was force-overridden to 16 previously -- see note above
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5, 3, True]]
  - [-1, 2, C2PSA, [1024]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, True]]

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, True]]

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, True]]

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 1, C3k2, [1024, True, 0.5, True]]

  - [[16, 19, 22], 1, Detect, [nc]]
